version: '3.8'

services:
  gmail-classifier:
    build: .
    image: gmail-classifier:v7.1
    container_name: gmail-classifier
    restart: always
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - CLASSIFIER_API_KEY=${CLASSIFIER_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-BAAI/bge-m3}
      - QDRANT_PATH=qdrant_data
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-embeddings_v7_1}
      - MAX_BATCH_SIZE=${MAX_BATCH_SIZE:-100}
      - WEIGHT_SUBJECT=${WEIGHT_SUBJECT:-0.65}
      - WEIGHT_BODY=${WEIGHT_BODY:-0.35}
      - AUTO_SORT_CONFIDENCE=${AUTO_SORT_CONFIDENCE:-0.82}
      - AUTO_SORT_MARGIN=${AUTO_SORT_MARGIN:-0.08}
    volumes:
      # Persist Qdrant embeddings to avoid regenerating them
      - ./qdrant_data:/app/qdrant_data
      # Persist HuggingFace downloaded models (BGE-M3 is 2GB+)
      - huggingface_cache:/root/.cache/huggingface
    networks:
      - proxy_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  proxy_network:
    external: true

volumes:
  huggingface_cache:
